<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Grapa</title>
    <style>
      /* Forzamos a que el documento ocupe toda la pantalla sin barras de desplazamiento */
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #231F20;
      }
    </style>
  </head>
  <body>
    <!-- Cambiamos los píxeles fijos por width y height al 100% -->
    <canvas id="unity-canvas" tabindex="-1" style="width: 100%; height: 100%; display: block;"></canvas>
    <script src="Build/grapa_html.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      var canvas = document.querySelector("#unity-canvas");
      // Forzamos el redimensionado también por JavaScript por seguridad
      canvas.style.width = "100%";
      canvas.style.height = "100%";

      createUnityInstance(canvas, {
        dataUrl: "Build/grapa_html.data",
        frameworkUrl: "Build/grapa_html.framework.js",
        codeUrl: "Build/grapa_html.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "TheWorkerMole",
        productName: "Grapa",
        productVersion: "1.0",
      });
    </script>
  </body>
</html>
